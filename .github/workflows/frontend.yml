name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main   # CI runs when PR is created to main

  push:
    branches:
      - main   # CD runs when code is merged/pushed to main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint || true

      - name: Run Tests
        run: npm test -- --watchAll=false

      - name: Build Project
        run: npm run build

      # =========================
      # 🚀 CD PART STARTS HERE
      # =========================

      - name: Deploy to Vercel
        if: github.event_name == 'push'   # ✅ Only run this step on push (after merge to main)
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        # --prod deploys to production
        # VERCEL_TOKEN is stored in GitHub Secrets for security

      # =========================
      # 🚀 CD PART ENDS HERE
      # =========================
